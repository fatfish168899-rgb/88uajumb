<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to 88UA loading...</title>
  <style>

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #e0f7fa, #fafafa);
      font-family: Arial, sans-serif;
      color: #333;
      overflow: hidden;
    }
    .loading {
      text-align: center;
    }
    .logo {
      width: 80px; 
      margin-bottom: 15px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top-color: #2196f3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="loading">
  <img class="logo" src="logo.png" alt="Logo">
  <div class="spinner"></div>
  <div>loading...</div>
</div>

<script>
  const redirectURL = "https://www.88ua88.one/home?affiliateCode=88jumb";
  let scriptLoaded = false, pixelLoaded = false;

  function tryRedirect() {
    if (scriptLoaded && pixelLoaded) {
      setTimeout(() => {
        window.location.href = redirectURL;
      }, 200); 
    }
  }


  const script = document.createElement('script');
  script.src = "https://analytics.fatfish.cc/script.php?site_id=5";
  script.onload = () => { scriptLoaded = true; tryRedirect(); };
  script.onerror = () => { scriptLoaded = true; tryRedirect(); };
  document.head.appendChild(script);


  setTimeout(() => {
    if (!scriptLoaded || !pixelLoaded) {
      window.location.href = redirectURL;
    }
  }, 900);
</script>

</body>
</html>
